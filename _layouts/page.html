---
layout: default
---
<div class="container" style="padding-top: 3rem;">
  <header class="page-header fade-in">
    <h1>{% include tt.html en=page.title id=page.title_id %}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{% include tt.html en=page.subtitle id=page.subtitle_id %}</p>{% endif %}
  </header>
  {% if page.lede %}<p class="page-lede fade-in">{% include tt.html en=page.lede id=page.lede_id %}</p>{% endif %}
  <div class="page-content">
    {{ content }}
  </div>
</div>
