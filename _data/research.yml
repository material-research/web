# Research areas (Home "What We Study" uses name/desc/icon/illus; the Research page also uses the extra fields below).
# topics, materials (planned: true adds the "planned" tag), apps, next are optional; each has an _id twin for Indonesian.
# icon: any Font Awesome 6 free icon name (without "fa-")
# Fields ending in _id are the Indonesian text.
- name: Composite Materials Engineering
  name_id: Teknologi Rekayasa Material Komposit
  icon: seedling
  illus: composites
  iso: true            # isometric illustration (_includes/illus/composites-iso.html); remove the line to use the old flat one
  desc: >-
    Our main field is the engineering and technology of composite materials made
    from plant-based resources. Current work covers bamboo (Gigantochloa atter) and
    ramie fibers in epoxy and polyester matrices, including alkaline fiber
    treatment, fiber–resin wettability and adhesion, flame retardancy, and
    drilling behavior, as well as rice husk-based smart composite panels for
    grain storage. We are expanding to other plant materials such as oil palm,
    coconut trunk (glugu), and coconut coir.
  desc_id: >-
    Bidang utama kami adalah teknologi rekayasa material komposit berbahan sumber daya
    nabati. Riset saat ini mencakup serat bambu (Gigantochloa atter) dan rami pada
    matriks epoksi dan poliester, meliputi perlakuan alkali serat, keterbasahan dan
    adhesi serat–resin, ketahanan api, dan perilaku pengeboran, serta panel
    komposit pintar berbasis sekam padi untuk penyimpanan gabah. Kami memperluas
    kajian ke bahan tumbuhan lain seperti kelapa sawit, batang kelapa (glugu), dan
    sabut kelapa.
  anchor: composites
  main: true
  short: Composites
  short_id: Komposit
  topics:
    - Alkaline treatment of bamboo and ramie fibers
    - Fiber–resin wettability and adhesion
    - Flame-retardant composites
    - Drilling behavior of ramie/epoxy composites
    - Smart composite panels from rice husk
  topics_id:
    - Perlakuan alkali serat bambu dan rami
    - Keterbasahan dan adhesi serat–resin
    - Komposit tahan api
    - Perilaku pengeboran komposit rami/epoksi
    - Panel komposit pintar dari sekam padi
  materials_label: materials
  materials:
    - { en: "Bamboo (Gigantochloa atter)", id: "Bambu (Gigantochloa atter)" }
    - { en: "Ramie", id: "Rami" }
    - { en: "Rice husk", id: "Sekam padi" }
    - { en: "Oil palm", id: "Kelapa sawit", planned: true }
    - { en: "Coconut trunk (glugu)", id: "Batang kelapa (glugu)", planned: true }
    - { en: "Coconut coir", id: "Sabut kelapa", planned: true }
  apps:
    - Safety cabin panels
    - Smart composite panels for grain storage warehouses
    - Bamboo-based cushioning material
  apps_id:
    - Panel safety cabin
    - Panel komposit pintar untuk gudang penyimpanan gabah
    - Material bantalan berbasis bambu
  next: Extending the same approach to other plant materials, including oil palm, coconut trunk (glugu), and coconut coir.
  next_id: Memperluas pendekatan yang sama ke bahan tumbuhan lain, termasuk kelapa sawit, batang kelapa (glugu), dan sabut kelapa.
- name: Agro-Processing Machinery
  name_id: Mesin Pengolahan Agro
  icon: gears
  illus: agro
  iso: true
  desc: >-
    Design and development of machines for agricultural products, including
    coffee cherry wet processing and grading, coconut skin peeling, and ginger
    grating and pressing, plus reviews of rice milling, grinding, and corn
    threshing equipment.
  desc_id: >-
    Perancangan dan pengembangan mesin untuk hasil pertanian, antara lain
    pengolahan basah dan grading buah kopi, pengupas kulit ari kelapa, serta
    pemarut dan pemeras jahe, ditambah kajian mesin penggilingan padi dan
    perontok jagung.
  anchor: agro
