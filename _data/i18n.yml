# ---- About ----
about_who_title: { en: "Who We Are", id: "Siapa Kami" }
about_who_p1: { en: "The Agromaterials Research Group is a research group at Politeknik ATI Makassar. Our main field is composite materials engineering technology, and we connect it with the machines and manufacturing processes needed to turn agricultural resources into useful products.", id: "Agromaterials Research Group adalah kelompok riset di Politeknik ATI Makassar. Bidang utama kami adalah teknologi rekayasa material komposit, yang kami hubungkan dengan mesin dan proses manufaktur yang dibutuhkan untuk mengubah sumber daya pertanian menjadi produk bermanfaat." }
about_who_p2: { en: "We work with plant-based materials such as bamboo, ramie, and rice husk, and plan to study more, including oil palm, coconut trunk, and coconut coir. Our work also covers agro-processing machinery for coffee, coconut, and ginger, CNC manufacturing and simulation, and energy and drive systems, supported by national research funding.", id: "Kami bekerja dengan bahan nabati seperti bambu, rami, dan sekam padi, dan berencana mengkaji lebih banyak, termasuk kelapa sawit, batang kelapa, dan sabut kelapa. Riset kami juga mencakup mesin pengolahan agro untuk kopi, kelapa, dan jahe, manufaktur CNC dan simulasi, serta sistem energi dan penggerak, dengan dukungan pendanaan riset nasional." }
