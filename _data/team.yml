director:
  name: "Dr. Massriyady Massaguni, S.ST., M.T."
  label: "Research Director"
  label_id: "Direktur Riset"
  role: "Lecturer, Agro Industry Manufacturing Engineering, Politeknik ATI Makassar"
  role_id: "Dosen, Agro Industry Manufacturing Engineering, Politeknik ATI Makassar"
  photo: "team/massriyady.webp"
  bio: >-
    Lecturer at Politeknik ATI Makassar (since 2019) with a Doctorate and Master's
    degree in Mechanical Engineering from Hasanuddin University. Main expertise is
    composite materials engineering technology. Develops advanced, environmentally
    friendly composite materials from plant fibers, agricultural residues, and
    industrial waste, and supports the development of agro-manufacturing
    industries.
  bio_id: >-
    Dosen di Politeknik ATI Makassar (sejak 2019) bergelar Doktor dan Magister
    Teknik Mesin dari Universitas Hasanuddin. Kepakaran utama adalah teknologi
    rekayasa material komposit. Mengembangkan material komposit canggih yang ramah
    lingkungan dari serat tumbuhan, residu pertanian, dan limbah industri, serta
    mendukung pengembangan industri manufaktur agro.
  links:
    email: "mailto:massriyady.massaguni@atim.ac.id"
    scholar: "https://scholar.google.com/citations?user=Vtf6TCoAAAAJ&hl=id"
    orcid: "https://orcid.org/0000-0001-7132-8861"
    scopus: "https://www.scopus.com/authid/detail.uri?authorId=59703356800"
    github: ""
    linkedin: "https://www.linkedin.com/in/massriyady-massaguni-2061008b/"
    website: ""

